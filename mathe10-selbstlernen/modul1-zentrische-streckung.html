  if (C.ctx === 'page') {
    if (!C.pageHint) return;                                                      // Test-Ordner: nie in der Seite
    var p = location.pathname; if (!/\/(index\.html)?$/.test(p)) return;          // nur Startseite des Ordners
  }
  var deferred = null, box = null, shown = false;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; render(); });
  window.addEventListener('appinstalled', function () { try { localStorage.setItem(KEY, '1'); } catch (e) {} if (box) box.remove(); });
  function dismiss() { try { localStorage.setItem(KEY, '1'); } catch (e) {} if (box) { box.remove(); box = null; } }
  function render() {
    if (!shown) return; if (box) box.remove();
    box = document.createElement('div'); box.setAttribute('data-pwa', '1'); box.id = 'tfgs-pwa-hint'; box.setAttribute('role', 'note');
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483000;background:#0f172a;color:#fff;border-radius:14px;padding:12px 40px 12px 14px;font:15px/1.35 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:520px;margin:0 auto';
    var t = document.createElement('span');
    if (ios) t.textContent = '📲 Als App speichern: unten auf „Teilen“ (⬆︎) tippen und dann „Zum Home-Bildschirm“ wählen.';
    else if (deferred) t.textContent = '📲 Diese Seite als App auf dem Handy installieren?';
    else t.textContent = '📲 Als App speichern: im Browser-Menü (⋮) „App installieren“ bzw. „Zum Startbildschirm hinzufügen“ wählen.';
    box.appendChild(t);
    if (!ios && deferred) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Installieren';
      b.style.cssText = 'margin-left:10px;padding:6px 12px;border:0;border-radius:8px;background:#14b8a6;color:#04201d;font:600 15px system-ui,sans-serif;cursor:pointer';
      b.onclick = function () { var d = deferred; deferred = null; d.prompt(); d.userChoice.then(function () { dismiss(); }, function () {}); };
      box.appendChild(b);
    }
    var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'Hinweis schließen'); x.textContent = '✕';
    x.style.cssText = 'position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer';
    x.onclick = dismiss; box.appendChild(x);
    (document.body || document.documentElement).appendChild(box);
  }
  function ready() {
    if (C.ctx === 'gate') { var c = document.getElementById('staticrypt_content'); if (!c || c.classList.contains('hidden')) return false; }
    else { var t = document.querySelector('[data-pwa-test]'); if (t) return false; }
    return true;
  }
  var tries = 0, iv = setInterval(function () {
    if (++tries > 20) { clearInterval(iv); return; }
    if (!document.body) return;
    if (ready()) { clearInterval(iv); setTimeout(function () { if (ready()) { shown = true; render(); } }, 1200); }
  }, 400);
})();

</script>
<script data-kf-zurueck>
/* KlasseFit – gemeinsamer „Zurück“-Knopf (Handy/App ohne Browser-Zurück).
   Build bettet ihn in jede Schüler-HTML-Seite ein (wie PWA). API für In-Page-Navigation:
     KFZurueck.push(fn)  – eine Ebene auf den Stack (fn wird beim Zurück aufgerufen)
     KFZurueck.pop()     – oberste Ebene entfernen (ohne auszuführen)
     KFZurueck.clear()   – Stack leeren
     KFZurueck.setGuard(fn) – fn() → string (Bestätigungstext) oder falsy; vor dem Verlassen
   Verhalten: Stack → history.back() (wenn sinnvoll) → Portal-Start.
   Keine Passwörter/Logins/localStorage-Schlüssel der Seiten. */
(function () {
  /* Nach StatiCrypt-Entschlüsselung wird das DOM ersetzt – Knopf neu einhängen. */
  if (window.KFZurueck && window.KFZurueck._v === 1) {
    try { window.KFZurueck.remount && window.KFZurueck.remount(); } catch (e) {}
    return;
  }
  var PORTAL = (function () {
    try {
      var p = location.pathname || "";
      var i = p.indexOf("/portal");
      if (i >= 0) return p.slice(0, i + "/portal".length) + "/";
      // /unterricht/<site>/… → /unterricht/portal/
      var m = p.match(/^(.*?\/(?:unterricht\/)?)(?:[^/]+\/)/);
      if (m) return m[1] + "portal/";
    } catch (e) {}
    return "/unterricht/portal/";
  })();
  var stack = [];
  var guard = null;
  var btn = null;
  var spacer = null;

  function portalHome() {
    var p = (location.pathname || "").replace(/\/index\.html?$/, "/");
    return /\/portal\/?$/.test(p) && !(location.hash || "").replace(/^#\/?$/, "");
  }
  function canHistoryBack() {
    /* Nur zu einer ANDEREN Seite derselben Origin (z.B. Portal→Missionen).
       Gleicher Pfad = typisch StatiCrypt-Reload; ohne Referrer kein history.back (sonst about:blank). */
    try {
      var ref = document.referrer || "";
      if (!ref) return false;
      var a = document.createElement("a"); a.href = ref;
      if (a.origin !== location.origin) return false;
      var norm = function (x) { return String(x || "").replace(/\/index\.html?$/, "/"); };
      return norm(a.pathname) !== norm(location.pathname);
    } catch (e) { return false; }
  }
  function confirmLeave() {
    if (!guard) return true;
    var msg = null;
    try { msg = guard(); } catch (e) { msg = null; }
    if (!msg) return true;
    try { return confirm(String(msg)); } catch (e) { return true; }
  }
  function goPortal() {
    try { location.assign(new URL(PORTAL, location.origin).href); } catch (e) {
      try { location.href = PORTAL; } catch (e2) {}
    }
  }
  function back() {
    if (stack.length) {
      if (!confirmLeave()) return;
      var fn = stack.pop();
      update();
      try { fn && fn(); } catch (e) {}
      return;
    }
    if (portalHome()) return;
    if (!confirmLeave()) return;
    if (canHistoryBack()) {
      try { history.back(); return; } catch (e) {}
    }
    goPortal();
  }
  function update() {
    if (!btn) return;
    var hide = portalHome() && !stack.length;
    btn.hidden = hide;
    btn.setAttribute("aria-hidden", hide ? "true" : "false");
    if (spacer) spacer.hidden = hide;
    btn.setAttribute("aria-label", stack.length ? "Zurück (in der Seite)" : "Zurück");
  }
  function ensure() {
    if (btn && document.body && document.body.contains(btn)) { update(); return; }
    btn = null; spacer = null;
    var st = document.createElement("style");
    st.setAttribute("data-kf-zurueck", "1");
    st.textContent =
      "#kfZurueck{position:fixed;top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:2147482000;"
      + "min-width:44px;min-height:44px;padding:8px 12px;border:0;border-radius:999px;background:#0f172ae6;color:#fff;"
      + "font:700 14px/1.1 system-ui,Segoe UI,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;"
      + "-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:inline-flex;align-items:center;gap:6px}"
      + "#kfZurueck[hidden],#kfZurueckPad[hidden]{display:none!important}"
      /* Tests: Warte-Sperre der Test-Engine blendet body>* aus – Zurück bleibt trotzdem sichtbar (09.11.2026) */
      + "html.testgesperrt body>#kfZurueck#kfZurueck:not([hidden]){display:inline-flex!important}"
      + "#kfZurueck:active{transform:scale(.97)}"
      + "#kfZurueckPad{height:52px;pointer-events:none;flex-shrink:0}"
      + "@media print{#kfZurueck,#kfZurueckPad{display:none!important}}";
    (document.head || document.documentElement).appendChild(st);
    spacer = document.createElement("div");
    spacer.id = "kfZurueckPad";
    spacer.setAttribute("data-kf-zurueck", "1");
    spacer.setAttribute("aria-hidden", "true");
    btn = document.createElement("button");
    btn.id = "kfZurueck";
    btn.type = "button";
    btn.setAttribute("data-kf-zurueck", "1");
    btn.innerHTML = "<span aria-hidden=\"true\">←</span><span>Zurück</span>";
    btn.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); back(); });
    function mount() {
      if (!document.body) return;
      if (!spacer.parentNode) document.body.insertBefore(spacer, document.body.firstChild);
      if (!btn.parentNode) document.body.appendChild(btn);
      update();
    }
    if (document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
    window.addEventListener("hashchange", update);
    window.addEventListener("popstate", function () { setTimeout(update, 0); });
  }

  function remount() {
    btn = document.getElementById("kfZurueck");
    spacer = document.getElementById("kfZurueckPad");
    if (!document.getElementById("kfZurueck") || (btn && !document.body.contains(btn))) {
      btn = null; spacer = null;
    }
    ensure();
  }
  window.KFZurueck = {
    _v: 1,
    push: function (fn) { if (typeof fn === "function") { stack.push(fn); update(); } },
    pop: function () { var f = stack.pop(); update(); return f; },
    clear: function () { stack.length = 0; update(); },
    setGuard: function (fn) { guard = typeof fn === "function" ? fn : null; },
    back: back,
    remount: remount,
    portalUrl: function () { return PORTAL; }
  };
  ensure();
  document.addEventListener("staticrypt-decrypted", remount);
  window.addEventListener("pageshow", function () { setTimeout(remount, 0); });
  /* StatiCrypt ersetzt oft body ohne Event – kurz nachladen prüfen */
  setTimeout(remount, 50);
  setTimeout(remount, 400);
  setTimeout(remount, 1200);
  try {
    var mo = new MutationObserver(function () {
      if (!document.getElementById("kfZurueck") || (btn && document.body && !document.body.contains(btn))) remount();
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  } catch (e) {}
})();

</script>
