    if (!user || !code) { err.textContent = "Bitte Benutzername und Code eingeben."; return; }
    btn.disabled = true; err.textContent = "";
    try {
      await userLogin(user, code);
      var r = await staticrypt.handleDecryptOnLoad();
      if (!r.isSuccessful) throw new Error(templateError);
    } catch (ex) {
      btn.disabled = false;
      err.textContent = (ex && ex.message) || templateError;
      document.getElementById("sc-code").select();
    }
  });
})();
</script>
